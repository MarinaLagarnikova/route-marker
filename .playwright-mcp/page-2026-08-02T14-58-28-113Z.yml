      - heading "Что интересного на маршруте" [level=2] [ref=f4e150]
      - paragraph [ref=f4e151]: Маршрут проходит по центру Москвы, проводя по основным достопримечательностям столицы.
      - paragraph [ref=f4e152]: Красная площадь, Александровский сад, Храм Христа Спасителя, Крымская набережная и памятник Петру Первому, Парк Горького, Лужнецкий метромост, смотровая площадка на Воробьевых горах с прекрасными видами на город.
      - paragraph [ref=f4e153]: Маршрут можно использовать для тренировки навигации на местности, а также переходов на длительные расстояния новичками и детьми. Можно проходить маршрут в обе стороны.
      - heading "Важно знать" [level=2] [ref=f4e154]
      - heading "Ограничения и особенности" [level=3] [ref=f4e155]
